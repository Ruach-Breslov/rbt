name: Sync Google Calendar events

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

concurrency:
  group: google-calendar-event-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Check public events calendar
    if: github.event_name == 'workflow_dispatch' || vars.GOOGLE_CALENDAR_ICAL_URL != ''
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    env:
      GOOGLE_CALENDAR_ICAL_URL: ${{ vars.GOOGLE_CALENDAR_ICAL_URL }}

    steps:
      - name: Checkout main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: main

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Test calendar parser
        run: npm run test:events

      - name: Check calendar connection
        id: calendar
        shell: bash
        run: |
          if [[ -z "${GOOGLE_CALENDAR_ICAL_URL}" ]]; then
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::Add the public iCal address as the GOOGLE_CALENDAR_ICAL_URL repository variable to activate event sync."
          else
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Sync upcoming events
        if: steps.calendar.outputs.configured == 'true'
        run: npm run sync:events

      - name: Detect catalog changes
        if: steps.calendar.outputs.configured == 'true'
        id: catalog
        shell: bash
        run: |
          if git diff --quiet -- data/calendar-events.json; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Publish event catalog
        if: steps.catalog.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar-events.json
          git commit -m "chore: sync Google Calendar events"
          gh auth setup-git
          git push origin HEAD:main

      - name: Deploy updated events
        if: steps.catalog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-github-pages.yml --ref main
